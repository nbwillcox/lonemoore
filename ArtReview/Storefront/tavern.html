<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tavern storefront study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080706;color:#eee0c6;font-family:Georgia,serif;overflow:hidden}#stage{width:1600px;height:900px;position:absolute;transform-origin:top left;background:url('../../.art/locations/town/tavern.png') center/100% 100% no-repeat}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffe0a0;outline-offset:4px}.panel{background:linear-gradient(120deg,rgba(27,23,18,.97),rgba(15,14,12,.94));border:1px solid #947345;box-shadow:0 0 0 3px #181511,0 0 0 4px #59462e,0 12px 30px #0008}.left{position:absolute;left:34px;top:124px;width:390px;padding:25px}.eyebrow{font:12px Arial,sans-serif;letter-spacing:3px;color:#bb9c68;text-transform:uppercase}h1{font-size:43px;font-weight:normal;margin:7px 0 16px;color:#edc98b}.intro{color:#c6b8a1;font-size:17px;line-height:1.5;margin:0 0 25px}.service{display:block;width:100%;text-align:left;background:#ffffff04;border:1px solid #6b5738;margin:11px 0;padding:16px 16px;position:relative}.service:hover,.service[aria-pressed=true]{background:linear-gradient(90deg,#76542c65,#3b302330);border-color:#d1a66b}.service b{font-size:22px;font-weight:normal;display:block}.service small{display:block;color:#b8ad98;font:14px Arial,sans-serif;margin-top:8px}.price{float:right;color:#e5c180;font:17px Georgia,serif}.hint{font:12px Arial,sans-serif;color:#a39785;margin-top:20px;line-height:1.5}.right{position:absolute;right:30px;top:218px;width:342px;padding:26px}h2{font-size:30px;font-weight:normal;color:#edc98b;margin:12px 0 20px}.description{font:17px/1.6 Arial,sans-serif;color:#d9cebb;min-height:116px}.facts{border-top:1px solid #675137;border-bottom:1px solid #675137;padding:17px 0;margin:18px 0;font:15px/1.65 Arial,sans-serif;color:#bdaf97}.buy{background:linear-gradient(#80603a,#49351e);border:1px solid #c29b60;padding:16px;width:100%;font-size:19px}.buy:disabled{opacity:.5;cursor:default}.top{position:absolute;right:30px;top:30px;display:flex;align-items:center;gap:24px}.gold{font:23px Georgia,serif;color:#f2d395;text-shadow:0 2px 4px #000}.back{background:#18140ee8;border:1px solid #a08051;padding:12px 25px}.bottom{position:absolute;left:30px;right:30px;bottom:22px;height:76px;display:flex;align-items:center;padding:15px 22px;gap:24px}.hero{width:220px;font-size:20px}.hero small{font:12px Arial,sans-serif;color:#b7a990;margin-left:10px}.bars{font:11px Arial,sans-serif;margin-top:7px;display:flex;gap:6px}.bars span{padding:4px 12px;background:#662d26}.bars span+span{background:#24455d}.message{flex:1;font:16px/1.45 Arial,sans-serif;color:#c9bca6}.nav{background:transparent;border:1px solid #796142;padding:11px 18px;font-size:17px}.study{position:absolute;top:30px;left:34px;color:#d4b47d;font:11px Arial,sans-serif;letter-spacing:2px;background:#18140ec9;padding:9px 12px}
</style></head><body><main id="stage" aria-label="Interactive tavern storefront sample">
<div class="study">STOREFRONT STUDY · TAVERN</div><div class="top"><span class="gold"><span id="gold">408</span> gold</span><button class="back" id="back">Town Square ↗</button></div>
<section class="left panel"><div class="eyebrow">Lonemoore</div><h1>The Tavern</h1><p class="intro">A fire, a bowl of stew, and a room with no whispers in the walls.</p><div id="services"></div><div class="hint">Hover to inspect · Select to keep details open</div></section>
<section class="right panel" aria-label="Service details"><div class="eyebrow">At your service</div><h2 id="name"></h2><div id="description" class="description"></div><div id="facts" class="facts"></div><button id="buy" class="buy"></button></section>
<footer class="bottom panel"><div class="hero">Lana <small>Lv. 1 Mage</small><div class="bars"><span>71 HP</span><span>29 MP</span></div></div><div id="message" class="message" aria-live="polite">Warm lamps, cold whispers. Stay a little while.</div><button class="nav">Inventory</button><button class="nav">Character</button><button class="nav">Hunts</button></footer>
</main><script>
const services=[{name:'Heal living heroes',short:'Health & cleansing',price:10,description:'Restore every living hero to full health and clear their status effects.',facts:'Affects: all living heroes<br>Does not restore mana or revive fallen heroes.',action:'Heal party'}, {name:'Rest for the night',short:'Full health & mana',price:18,description:'A safe room and a full rest. Restore HP and MP, and clear status effects for every living hero.',facts:'Affects: all living heroes<br>Fallen heroes are not revived.',action:'Take a room'}, {name:'Warm meal',short:'+10% damage · 3 fights',price:14,description:'A hearty meal before the descent. Your party deals 10% more damage for the next three fights.',facts:'Duration: next 3 fights<br>Another meal refreshes the duration; the bonus does not stack.',action:'Order a meal'}, {name:'Travel supplies',short:'Visit the merchant',price:null,description:'Browse the merchant’s stock of equipment and provisions for your next descent.',facts:'Opens: merchant storefront<br>Item prices and full details appear there.',action:'Browse supplies'}];
let selected=2,shown=2,gold=408;const list=document.getElementById('services'),message=document.getElementById('message');
services.forEach((s,i)=>{const b=document.createElement('button');b.className='service';b.innerHTML='<span class="price">'+(s.price===null?'↗':s.price+' g')+'</span><b>'+s.name+'</b><small>'+s.short+'</small>';b.addEventListener('mouseenter',()=>show(i));b.addEventListener('focus',()=>show(i));b.addEventListener('click',()=>{selected=i;show(i)});list.appendChild(b)});
list.addEventListener('mouseleave',()=>show(selected));function show(i){shown=i;const s=services[i];document.getElementById('name').textContent=s.name;document.getElementById('description').textContent=s.description;document.getElementById('facts').innerHTML=s.facts;const buy=document.getElementById('buy');buy.textContent=s.action+(s.price===null?' ↗':' · '+s.price+' gold');buy.disabled=s.price!==null&&gold<s.price;[...list.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===selected))}
document.getElementById('buy').onclick=()=>{const s=services[shown];if(s.price===null){message.textContent='Preview: this opens the merchant’s inventory in the game.';return}gold-=s.price;document.getElementById('gold').textContent=gold;message.textContent='Sample purchase: '+s.name+'. Demo gold only; your game save is untouched.';show(shown)};
document.getElementById('back').onclick=()=>message.textContent='Preview: return to Town Square in the game.';document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>message.textContent='Preview: '+b.textContent+' opens here in the game.');
function resize(){const scale=Math.min(innerWidth/1600,innerHeight/900),stage=document.getElementById('stage');stage.style.transform='scale('+scale+')';stage.style.left=(innerWidth-1600*scale)/2+'px';stage.style.top=(innerHeight-900*scale)/2+'px'}addEventListener('resize',resize);resize();show(selected);
</script></body></html>
